name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build StartupPorts.slnx -c Release --nologo
      - name: Check real Windows port tables
        run: dotnet run --project tests/StartupPorts.Checks -c Release --no-build
      - name: Install Inno Setup
        if: github.event_name != 'pull_request'
        run: choco install innosetup -y --no-progress
      - name: Build installer
        if: github.event_name != 'pull_request'
        run: ./scripts/build-installer.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: StartupPorts-win-x64
          path: artifacts/release/*
          if-no-files-found: error
